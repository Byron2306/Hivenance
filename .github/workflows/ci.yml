name: VAMP CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static compile checks
        run: |
          python -m py_compile main.py agents/ui_agent.py
          python -m compileall agents swarmguard_service buzzservice main.py SWARM.py

      - name: Backend and pytest suites
        run: |
          if [ -f backend_test.py ]; then python3 backend_test.py; fi
          pytest -q

      - name: Full VAMP checks (smoke + redundancy scan)
        run: |
          if [ -f start_vamp.py ] && [ -f scripts/run_vamp_checks.sh ]; then
            bash scripts/run_vamp_checks.sh
          else
            echo "Skipping VAMP smoke checks (start_vamp.py not present)"
          fi
